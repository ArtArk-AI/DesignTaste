[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DesignTaste"
version = "0.1.0"
description = "Paired benchmark tools for open-ended visual design generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "Pillow>=10,<12"]

[project.urls]
Repository = "https://github.com/ArtArk-AI/DesignTaste"

[project.scripts]
designtaste-compare = "designtaste.cli:compare"

[tool.setuptools.packages.find]
where = ["src"]
